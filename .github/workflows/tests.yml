name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}
      - name: Run tests with coverage
        run: uv run --frozen pytest --cov=quantproof --cov-report=term --cov-report=xml --cov-fail-under=85
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  lowest-direct:
    name: pytest (Python 3.10, lowest direct dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the oldest allowed versions of direct dependencies
        run: |
          uv venv --python 3.10
          uv pip install --resolution lowest-direct -e ".[dev]"
      - name: Run tests
        run: uv run --no-sync pytest -q
