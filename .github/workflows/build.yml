name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Install the wheel in a clean environment and smoke-test
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install "$(ls dist/*.whl)[parquet]"
          cd /tmp
          /tmp/wheel-env/bin/quantproof version
          /tmp/wheel-env/bin/quantproof generate-data /tmp/prices.csv --n 600
          /tmp/wheel-env/bin/quantproof validate /tmp/prices.csv
          /tmp/wheel-env/bin/python -c "
          import pandas as pd
          from quantproof import AuditConfig, audit
          from quantproof.data import generate_prices
          prices = generate_prices(600, seed=1)
          def generate_signals(data):
              c = data['close']
              return (c.rolling(10).mean() > c.rolling(50).mean()).astype(float).where(c.rolling(50).mean().notna())
          result = audit(strategy=generate_signals, data=prices, config=AuditConfig(quick=True))
          assert result.status.value in {'PASS', 'WARN'}, result.summary
          print('wheel smoke test:', result.status.value)
          "
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
