[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "quantproof"
dynamic = ["version"]
description = "Research-grade validation and auditing for quantitative trading strategies. Detect look-ahead bias, temporal leakage, overfitting, unrealistic execution assumptions, and statistical weaknesses before trusting a backtest."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "QuantProof contributors" }]
keywords = [
  "quantitative-finance",
  "backtesting",
  "look-ahead-bias",
  "overfitting",
  "deflated-sharpe-ratio",
  "probability-of-backtest-overfitting",
  "cross-validation",
  "research-audit",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "pydantic>=2.5",
  "typer>=0.12",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
ml = ["scikit-learn>=1.3"]
all = ["pyarrow>=14", "scikit-learn>=1.3"]
dev = [
  "pyarrow>=14",
  "scikit-learn>=1.3",
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.10",
  "pandas-stubs>=2.0",
  "types-PyYAML>=6.0",
  "build>=1.2",
  "twine>=5",
]

[project.scripts]
quantproof = "quantproof.cli:main"

[project.urls]
Homepage = "https://github.com/z33shxn/QuantProof"
Repository = "https://github.com/z33shxn/QuantProof"
Issues = "https://github.com/z33shxn/QuantProof/issues"
Changelog = "https://github.com/z33shxn/QuantProof/blob/HEAD/CHANGELOG.md"

[tool.hatch.version]
path = "src/quantproof/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/quantproof"]

[tool.hatch.build.targets.sdist]
include = [
  "src/quantproof",
  "tests",
  "examples",
  "docs",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-ra --strict-markers --doctest-modules"
markers = [
  "slow: long-running end-to-end tests",
]
filterwarnings = [
  "error::FutureWarning",
]

[tool.coverage.run]
source = ["quantproof"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise AssertionError",
  "@overload",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD", "RUF", "C4", "PIE", "PT"]
ignore = [
  "E501",   # the formatter enforces line length; long message strings are allowed
  "PD101",  # nunique() > 1 is clearer than the suggested idiom
  "PD010",  # unstack is the natural (timestamp, symbol) -> wide reshape
  "PD011",  # .values is used deliberately on numpy-backed series
  "RUF001", # box-drawing characters in CLI output are intentional
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["PD", "NPY002"]
"tests/fixtures/**" = ["PD", "NPY002", "F841", "B018"]
"tests/**" = ["PT018"]  # compound assertions keep related invariants together

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
files = ["src/quantproof"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
